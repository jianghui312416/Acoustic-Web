<!doctype html>
<meta charset="utf-8">
<title>GeoVis terrain regression</title>
<style>
  html,
  body,
  #earth {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden
  }

  #report {
    position: absolute;
    z-index: 10;
    left: 10px;
    top: 10px;
    background: #fff;
    padding: 12px;
    max-width: 650px;
    white-space: pre-wrap
  }
</style>
<div id="earth"></div>
<div id="report"><button id="run">运行水平视角回归</button><button id="near">查看参考位置的近地视角</button><button id="volume">测试
    sampler3D 体渲染</button>
  <pre id="status">Ready</pre>
</div>
<script src="/GeoVis.js"></script>
<script type="module">
  import { createCesiumViewer } from '/src/utils/cesium.js'
  import { SoundField } from '/src/sdk/SoundField.js'
  const status = document.querySelector('#status')
  const errors = []
  window.addEventListener('error', e => errors.push(e.message))
  window.addEventListener('unhandledrejection', e => errors.push(String(e.reason)))
  const C = window.GeoVis
  const params = new URLSearchParams(location.search)
  const legacy = params.has('legacy')
  const requestWebgl2 = params.has('webgl2')
  // A/B control: use the original workers without modifying production setup.
  const earth = legacy ? new C.Earth('earth', { scene3DOnly: false }) : createCesiumViewer('earth', { requestWebgl2 })
  if (legacy) earth.scene.terrainProvider = new C.EllipsoidTerrainProvider()
  const gl = earth.scene.context?._gl || earth.scene.context?.gl
  status.textContent = `WebGL2：${typeof gl?.texImage3D === 'function' ? '是' : '否'}`
  let frames = 0
  earth.scene.postRender.addEventListener(() => frames++)
  earth.scene.renderError.addEventListener((scene, error) => errors.push(String(error)))
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
  const edges = ['westIndicesSouthToNorth', 'southIndicesEastToWest', 'eastIndicesNorthToSouth', 'northIndicesWestToEast']
  document.querySelector('#volume').onclick = async () => {
    errors.length = 0
    const width = 24, height = 32, depth = 12
    const data = new Uint8Array(width * height * depth * 4)
    for (let z = 0; z < depth; z++) for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
      const i = ((z * height + y) * width + x) * 4
      const radial = x / (width - 1)
      data[i] = Math.round(255 * (0.15 + radial * 0.75))
      data[i + 1] = data[i]
      data[i + 2] = data[i]
      data[i + 3] = Math.round(255 * Math.sin(Math.PI * radial) * (0.45 + 0.55 * Math.sin(Math.PI * z / (depth - 1))))
    }
    const texture = {
      width, height, depth, data, valueMin: 60, valueMax: 120,
      lonMin: 115.4, lonMax: 116.6, latMin: 15.4, latMax: 16.6,
      depthMin: 0, depthMax: 600, depthValues: Array.from({ length: depth }, (_, i) => i * 600 / (depth - 1)),
      sourceWidth: width, sourceHeight: height, sourceDepth: depth,
      wedgeMeta: { sourceLon: 116, sourceLat: 16, angleMin: -180, angleMax: 180, pathMinM: 0, pathMaxM: 65000, depthMinM: 0, depthMaxM: 600 },
    }
    const field = new SoundField(earth, { depthExaggeration: 8 })
    field.setVolume(texture, value => value)
    field.sync()
    field.flyToOverview(0)
    earth.scene.requestRender?.()
    await wait(1600)
    const failure = field.getError()?.message || errors.join('; ')
    status.textContent = failure ? `FAIL: ${failure}` : `PASS: sampler3D 体渲染已创建（${width}×${height}×${depth}）`
  }
  document.querySelector('#near').onclick = () => {
    earth.camera.setView({
      destination: C.Cartesian3.fromDegrees(-19.73802, 74.53096, 20000),
      orientation: { heading: C.Math.toRadians(270), pitch: C.Math.toRadians(-20), roll: 0 },
    })
    earth.scene.screenSpaceCameraController.enableInputs = true
    const updateStatus = () => {
      const position = earth.camera.positionCartographic
      status.textContent = `高度：${position.height.toFixed(1)} m | 经度：${C.Math.toDegrees(position.longitude).toFixed(4)}° | 纬度：${C.Math.toDegrees(position.latitude).toFixed(4)}° | 俯仰：${C.Math.toDegrees(earth.camera.pitch).toFixed(1)}° | 错误：${errors.join('; ') || '无'}`
    }
    updateStatus()
    earth.scene.postRender.addEventListener(updateStatus)
    setInterval(updateStatus, 500)
    earth.scene.requestRender?.()
  }
  document.querySelector('#run').onclick = async () => {
    document.querySelector('#run').disabled = true
    try {
      // Exercise real worker return values, including the previously missing fields.
      const scheme = new C.GeographicTilingScheme()
      const terrain = new C.QuantizedMeshTerrainData({
        minimumHeight: 0, maximumHeight: 100,
        quantizedVertices: new Uint16Array([0, 32767, 0, 32767, 0, 0, 32767, 32767, 0, 0, 0, 0]),
        indices: new Uint16Array([0, 1, 2, 1, 3, 2]),
        westIndices: new Uint16Array([0, 2]), southIndices: new Uint16Array([1, 0]),
        eastIndices: new Uint16Array([3, 1]), northIndices: new Uint16Array([2, 3]),
        westSkirtHeight: 10, southSkirtHeight: 10, eastSkirtHeight: 10, northSkirtHeight: 10,
        boundingSphere: new C.BoundingSphere(C.Cartesian3.ZERO, 10000000),
        horizonOcclusionPoint: new C.Cartesian3(1, 0, 0),
      })
      const mesh = await terrain.createMesh(scheme, 0, 0, 0, 1)
      for (const edge of edges) if (!mesh[edge]?.length) throw new Error('Missing edge: ' + edge)
      let report = 'PASS: quantized terrain mesh has all four edge indices\n'
      const heightmap = new C.HeightmapTerrainData({ buffer: new Uint16Array(16), width: 4, height: 4 })
      const heightMesh = await heightmap.createMesh(scheme, 0, 0, 0, 1)
      for (const edge of edges) if (heightMesh[edge]?.length !== 4) throw new Error('Invalid heightmap edge: ' + edge)
      report += 'PASS: heightmap mesh has all four correctly sized edges\n'
      for (const pitch of [-90, -45, -10, -2, 0, -2, -30, -90]) {
        const before = frames
        earth.camera.setView({ destination: C.Cartesian3.fromDegrees(116, 16, 80000), orientation: { heading: C.Math.toRadians(60), pitch: C.Math.toRadians(pitch), roll: 0 } })
        await wait(2200)
        if (frames <= before) throw new Error('Render stopped at pitch ' + pitch)
        if (errors.length) throw new Error(errors.join('\n'))
        report += `PASS: pitch ${pitch}°, ${frames - before} frames\n`
        status.textContent = report
      }
      status.textContent = report + 'PASS: horizontal-view regression completed; no render errors\nTerrain provider: ' + earth.scene.terrainProvider.constructor.name
    } catch (error) { status.textContent = 'FAIL: ' + error.stack }
    document.querySelector('#run').disabled = false
  }
</script>
